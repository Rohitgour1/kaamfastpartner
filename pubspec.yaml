name: kaamfast_partner
description: Kaam Fast Partner app — Grow Your Work
publish_to: 'none'
version: 1.0.10+10

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^16.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  dio: ^5.11.0
  flutter_secure_storage: ^9.2.4
  flutter_overlay_window: ^0.5.0
  razorpay_flutter: ^1.4.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_database: ^12.1.4
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Generate launcher icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#000666"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#000666"
    theme_color: "#000666"
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/audio/ringtone.wav
